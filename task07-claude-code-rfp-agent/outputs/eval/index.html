<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RFP Strategy Comparison</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --ink: #e6edf3; --muted: #9198a1; --win: #5bd1a6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 32px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 28px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; }
  .winner { display: inline-block; background: rgba(91,209,166,.12);
    border: 1px solid var(--win); color: var(--win); border-radius: 999px;
    padding: 4px 12px; margin-right: 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  canvas { max-height: 300px; }
</style>
</head>
<body>
  <h1>RFP Strategy Comparison</h1>
  <div class="sub" id="meta"></div>
  <div id="winners" style="margin-bottom:24px"></div>
  <div class="grid">
    <div class="card"><h2>Cost per strategy (USD)</h2><canvas id="cost"></canvas></div>
    <div class="card"><h2>Token usage breakdown</h2><canvas id="tokens"></canvas></div>
    <div class="card"><h2>Quality by rubric dimension</h2><canvas id="quality"></canvas></div>
    <div class="card"><h2>Quality per dollar</h2><canvas id="value"></canvas></div>
  </div>
  <div class="card" style="margin-top:20px">
    <h2>Summary</h2>
    <table id="summary"></table>
  </div>
<script>
const REPORT_DATA = {"rfp": "synthetic-data/rfp-acme-corp.md", "generated_at": "2026-07-02 14:52 UTC", "rubric_dims": ["completeness", "specificity", "actionability", "risk_depth", "correctness"], "strategies": [{"strategy_key": "single", "label": "Single Agent", "cost_usd": 1.5543869500000003, "input_tokens": 750, "output_tokens": 66540, "cache_read_tokens": 701684, "cache_creation_tokens": 64972, "total_tokens": 833946, "num_turns": 26, "duration_ms": 1041603, "is_error": false, "quality": {"completeness": 3, "specificity": 4, "actionability": 4, "risk_depth": 3, "correctness": 4, "total": 18, "rationale": "Covers technical and commercial sections well with good concrete numbers and two customer references, but lacks an explicit competitive-positioning section and the risk dashboard appears structurally sound yet the proposal's contractual analysis is less surfaced than the other strategies."}, "quality_per_dollar": 11.5801}, {"strategy_key": "swarm", "label": "Agent Swarm", "cost_usd": 1.8366508000000001, "input_tokens": 827, "output_tokens": 59836, "cache_read_tokens": 1082045, "cache_creation_tokens": 136763, "total_tokens": 1279471, "num_turns": 16, "duration_ms": 824645, "is_error": false, "quality": {"completeness": 5, "specificity": 5, "actionability": 5, "risk_depth": 4, "correctness": 4, "total": 23, "rationale": "The multi-specialist swarm produces the most comprehensive output \u2014 explicit win theme, requirement-by-requirement fit table, named list price with exact discount math, three referenceable customers, and five named legal counter-positions \u2014 making it the most decision-ready response, though the risk dashboard's revenue-driver scoring could be more granular."}, "quality_per_dollar": 12.5228}, {"strategy_key": "dynamic", "label": "Dynamic Workflow", "cost_usd": 1.2173169, "input_tokens": 753, "output_tokens": 41439, "cache_read_tokens": 535043, "cache_creation_tokens": 72443, "total_tokens": 649678, "num_turns": 24, "duration_ms": 691068, "is_error": false, "quality": {"completeness": 5, "specificity": 5, "actionability": 5, "risk_depth": 4, "correctness": 5, "total": 24, "rationale": "Adds a company-background section and 5-year TCO comparisons with quantified percentage advantages over named competitors, cites the most precise facts (3.1\u00d7 peak, $1.8B valuation, 340+ customers, 2 exabytes/month, Stark deal size), and the risk HTML is the most polished with an internal-only banner and expandable clause cards, making it the internally consistent and evidence-rich proposal with no detectable contradictions."}, "quality_per_dollar": 19.7155}], "winner_quality": "dynamic", "winner_value": "dynamic"};
const D = REPORT_DATA;
const PALETTE = ['#3987e5', '#199e70', '#c98500', '#a371f7'];
const labels = D.strategies.map(s => s.label);

document.getElementById('meta').textContent =
  `RFP: ${D.rfp || 'n/a'} · generated ${D.generated_at}`;

const wq = D.strategies.find(s => s.strategy_key === D.winner_quality);
const wv = D.strategies.find(s => s.strategy_key === D.winner_value);
document.getElementById('winners').innerHTML =
  (wq ? `<span class="winner">🏆 Best quality: ${wq.label}</span>` : '') +
  (wv ? `<span class="winner">💰 Best value: ${wv.label}</span>` : '');

new Chart(document.getElementById('cost'), {
  type: 'bar',
  data: { labels, datasets: [{ label: 'USD', data: D.strategies.map(s => s.cost_usd),
    backgroundColor: PALETTE }] },
  options: { plugins: { legend: { display: false } } }
});

const tokenKeys = ['input_tokens', 'output_tokens', 'cache_read_tokens', 'cache_creation_tokens'];
const tokenLabels = ['Input', 'Output', 'Cache read', 'Cache create'];
new Chart(document.getElementById('tokens'), {
  type: 'bar',
  data: { labels, datasets: tokenKeys.map((k, i) => ({
    label: tokenLabels[i], data: D.strategies.map(s => s[k]),
    backgroundColor: PALETTE[i % PALETTE.length] })) },
  options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } } }
});

new Chart(document.getElementById('quality'), {
  type: 'radar',
  data: { labels: D.rubric_dims, datasets: D.strategies.map((s, i) => ({
    label: s.label, data: D.rubric_dims.map(d => s.quality[d]),
    borderColor: PALETTE[i], backgroundColor: PALETTE[i] + '33' })) },
  options: { scales: { r: { min: 0, max: 5 } } }
});

new Chart(document.getElementById('value'), {
  type: 'bar',
  data: { labels, datasets: [{ label: 'Quality / $',
    data: D.strategies.map(s => s.quality_per_dollar), backgroundColor: PALETTE }] },
  options: { plugins: { legend: { display: false } } }
});

const cols = [['Strategy', s => s.label], ['Cost $', s => s.cost_usd.toFixed(4)],
  ['Total tokens', s => s.total_tokens.toLocaleString()], ['Turns', s => s.num_turns],
  ['Duration s', s => (s.duration_ms / 1000).toFixed(0)],
  ['Quality', s => s.quality.total], ['Q/$', s => s.quality_per_dollar.toFixed(1)]];
const t = document.getElementById('summary');
t.innerHTML = '<tr>' + cols.map(c => `<th>${c[0]}</th>`).join('') + '</tr>' +
  D.strategies.map(s => '<tr>' + cols.map(c => `<td>${c[1](s)}</td>`).join('') + '</tr>').join('');
</script>
</body>
</html>
